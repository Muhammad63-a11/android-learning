name: AI App Doctor APK Builder

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct download URL of the user uploaded project ZIP'
        required: true
        type: string
      callback_url:
        description: 'The backend webhook URL to post the final status back to'
        required: false
        type: string

# CRITICAL CONCURRENCY TUNING:
# This ensures that your public runner queue processes exactly 1 or 2 builds simultaneously
# per repository, preventing workspace collisions and managing system overhead.
concurrency:
  group: ai-app-doctor-apk-builder
  cancel-in-progress: false

jobs:
  build:
    name: Examine, repair, build and validate APK
    runs-on: ubuntu-latest
    
    # Reduced from 180 to 30 minutes to keep your SaaS queue moving fast.
    # 10,000 people cannot share a queue if broken apps are allowed to hang for 3 hours.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # HIGH ACCURACY SANITIZATION LAYER:
      # This completely wipes the environment clean to ensure no cross-user file pollution occurs.
      - name: Download Remote ZIP file from Backend
        run: |
          echo "Wiping and resetting input workspace..."
          rm -rf input
          rm -rf output
          mkdir -p input
          mkdir -p output
          
          echo "Downloading target file from secure server node..."
          curl -L "${{ github.event.inputs.zip_url }}" -o input/project.zip
          
          # Absolute verification check
          if [ ! -s input/project.zip ]; then
            echo "::error::Network timeout or invalid URL. The ZIP payload was empty."
            exit 1
          fi
          
          echo "Verification Complete: input/project.zip successfully cached for compilation."

      # Hand control off seamlessly to your native AI error-correction system.
      - name: Run AI App Doctor pipeline
        id: doctor
        run: python scripts/app_doctor_pipeline.py

      # Preserves your resilient upload architecture so you always receive 
      # diagnostic logs and PDF reports even if the build crashes midway.
      - name: Upload validated APK + PDF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-app-doctor-validated-output
          path: |
            output/*.apk
            output/*.pdf
          if-no-files-found: warn
          retention-days: 7 # Lowered from 30 to 7 to optimize GitHub storage usage

      # SAAS CALL-BACK NOTIFICATION LAYER:
      # Fires a network signal back to your website backend server the exact second the build 
      # ends, updating your database so the user's dashboard shifts from "Processing" to "Download Ready".
      - name: Notify Backend Webhook
        if: always()
        run: |
          if [ -n "${{ github.event.inputs.callback_url }}" ]; then
            STATUS="failed"
            if [ -f output/*.apk ]; then
              STATUS="success"
            fi
            
            echo "Notifying web server at ${{ github.event.inputs.callback_url }} with status: $STATUS"
            
            curl -X POST "${{ github.event.inputs.callback_url }}" \
              -H "Content-Type: application/json" \
              -d "{\"run_id\": \"${{ github.run_id }}\", \"status\": \"$STATUS\"}"
          else
            echo "No callback URL provided. Skipping server notification."
          fi
