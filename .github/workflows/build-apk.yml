name: AI App Doctor APK Builder

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "App Doctor job ID"
        required: true
        type: string

      input_url:
        description: "Temporary private download URL for the uploaded ZIP"
        required: true
        type: string

      backend_url:
        description: "Render backend base URL"
        required: true
        type: string

concurrency:
  group: ai-app-doctor-apk-builder-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Examine, repair, build and validate APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ------------------------------------------------------
      # Prepare workspace
      # ------------------------------------------------------

      - name: Prepare clean workspace
        run: |
          set -e

          rm -rf input
          rm -rf output

          mkdir -p input
          mkdir -p output

          echo "Workspace prepared."

      # ------------------------------------------------------
      # Download private customer ZIP
      # ------------------------------------------------------

      - name: Download customer ZIP
        env:
          INPUT_URL: ${{ github.event.inputs.input_url }}
        run: |
          set -e

          echo "Downloading customer project..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "$INPUT_URL" \
            --output input/project.zip

          if [ ! -s input/project.zip ]; then
            echo "::error::Downloaded ZIP is empty."
            exit 1
          fi

          echo "ZIP downloaded successfully."

          file input/project.zip

      # ------------------------------------------------------
      # Run App Doctor
      # ------------------------------------------------------

      - name: Run AI App Doctor pipeline
        id: doctor
        run: |
          python scripts/app_doctor_pipeline.py

      # ------------------------------------------------------
      # Find APK
      # ------------------------------------------------------

      - name: Locate generated APK
        id: apk
        if: always()
        run: |
          set +e

          APK_PATH=$(find output \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -n "$APK_PATH" ]; then
            echo "APK found:"
            echo "$APK_PATH"
            echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No APK found."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------
      # Upload APK to Render
      # ------------------------------------------------------

      - name: Upload APK to backend
        if: steps.apk.outputs.found == 'true'
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          INTERNAL_API_KEY: ${{ secrets.RENDER_INTERNAL_API_KEY }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -e

          if [ -z "$INTERNAL_API_KEY" ]; then
            echo "::error::RENDER_INTERNAL_API_KEY GitHub secret is missing."
            exit 1
          fi

          UPLOAD_URL="${BACKEND_URL%/}/api/internal/jobs/${JOB_ID}/complete"

          echo "Uploading APK to backend..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -X POST \
            -H "X-Internal-Key: ${INTERNAL_API_KEY}" \
            -F "file=@${APK_PATH};type=application/vnd.android.package-archive" \
            "$UPLOAD_URL"

          echo "APK successfully uploaded."

      # ------------------------------------------------------
      # Notify backend of failure
      # ------------------------------------------------------

      - name: Notify backend of failed build
        if: failure() && steps.apk.outputs.found != 'true'
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          INTERNAL_API_KEY: ${{ secrets.RENDER_INTERNAL_API_KEY }}
        run: |
          set +e

          if [ -z "$INTERNAL_API_KEY" ]; then
            echo "::warning::RENDER_INTERNAL_API_KEY is missing."
            exit 0
          fi

          FAILURE_URL="${BACKEND_URL%/}/api/internal/jobs/${JOB_ID}/failed"

          curl \
            --fail \
            --location \
            --max-time 60 \
            -X POST \
            -H "X-Internal-Key: ${INTERNAL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"error":"Android APK build failed."}' \
            "$FAILURE_URL" || true

      # ------------------------------------------------------
      # Preserve GitHub artifact
      # ------------------------------------------------------

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-app-doctor-${{ github.event.inputs.job_id }}
          path: |
            output/*.apk
            output/*.pdf
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------

      - name: Cleanup customer files
        if: always()
        run: |
          rm -rf input/project.zip
          echo "Customer ZIP removed from runner workspace."
